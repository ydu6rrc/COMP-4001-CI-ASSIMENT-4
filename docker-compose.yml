version: '3.8'

services:
  studentportfolio:
    build: ./portfolio
    container_name: studentportfolio
    ports:
      - "3000:3000"
    networks:
      - prf-network

  bankingapp:
    build: ./banking
    container_name: bankingapp
    ports:
      - "5000:5000"
    networks:
      - prf-network

networks:
  prf-network:
    name: prf-network
    driver: bridge